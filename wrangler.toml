name = "studybot"
main = "src/worker.js" 
compatibility_date = "2026-10-01"

[triggers]
crons = ["0 15 * * *"]

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "study-bot-data"
database_id = "b9d282b9-b607-42bb-88d8-c69aa31a89a8"